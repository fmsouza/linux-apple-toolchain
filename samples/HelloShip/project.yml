name: HelloShipParity
options:
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
settings:
  base:
    PRODUCT_NAME: HelloShip
    PRODUCT_BUNDLE_IDENTIFIER: com.example.helloship
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "6.0"
    INFOPLIST_FILE: Resources/Info.plist
targets:
  HelloShip-iOS:
    type: application
    platform: iOS
    sources: [Sources/HelloShip, Resources/Assets.xcassets, Resources/PrivacyInfo.xcprivacy]
    settings:
      INFOPLIST_KEY_UILaunchScreen_Generation: YES   # iOS-only key; in base settings Xcode also stamps it into the macOS plist
  HelloShip-macOS:
    type: application
    platform: macOS
    sources: [Sources/HelloShip, Resources/PrivacyInfo.xcprivacy]
