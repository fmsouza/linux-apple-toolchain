name: HelloShipLaunchParity
options:
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
settings:
  base:
    PRODUCT_NAME: HelloShipLaunch
    PRODUCT_BUNDLE_IDENTIFIER: com.example.helloshiplaunch
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "6.0"
    INFOPLIST_FILE: Resources/Info.plist
targets:
  HelloShipLaunch-iOS:
    type: application
    platform: iOS
    sources: [Sources/HelloShipLaunch, Resources/Assets.xcassets, Resources/PrivacyInfo.xcprivacy, Resources/LaunchScreen.storyboard]
    settings:
      INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen   # iOS-only key; in base settings Xcode also stamps it into the macOS plist
  HelloShipLaunch-macOS:
    type: application
    platform: macOS
    sources: [Sources/HelloShipLaunch, Resources/PrivacyInfo.xcprivacy]
